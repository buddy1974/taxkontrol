name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taxkontrol
          POSTGRES_PASSWORD: taxkontrol_test
          POSTGRES_DB: taxkontrol_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taxkontrol" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Isolated CI database only — never a shared or production database.
      TEST_DATABASE_URL: postgresql://taxkontrol:taxkontrol_test@localhost:5432/taxkontrol_test
      DATABASE_URL: postgresql://taxkontrol:taxkontrol_test@localhost:5432/taxkontrol_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Migration drift check (schema vs. migrations)
        run: |
          PGPASSWORD=taxkontrol_test psql -h localhost -U taxkontrol -d taxkontrol_test -c 'CREATE DATABASE taxkontrol_shadow'
          SHADOW_DATABASE_URL=postgresql://taxkontrol:taxkontrol_test@localhost:5432/taxkontrol_shadow npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
